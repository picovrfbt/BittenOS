; Button remote for the protogen mask: a Seeed XIAO ESP32C6 that sits in deep sleep until a
; button is pressed, sends one ESP-NOW packet, and goes back to sleep. No power switch - at
; 15uA it can be left armed indefinitely.
;
; Its own project rather than an environment in ProtoESP-Controller: PlatformIO builds one
; source tree per project, and this is a different architecture (RISC-V, not Xtensa), so the
; first build fetches its own toolchain.
[env:xiao-c6]
platform = https://github.com/pioarduino/platform-espressif32.git
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1   ; the XIAO's only port is native USB, so the log has to go there
